name: goreleaser

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
          cache: true
      - name: Test
        run: go test ./...
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      - name: Check GoReleaser configuration
        run: goreleaser check

  release:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
          cache: true
      - name: Determine release mode
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^var Version = "([^"]+)"$/\1/p' include/version/version.go)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version in include/version/version.go: ${version}" >&2
            exit 1
          fi

          release_version="${version}.${GITHUB_RUN_NUMBER}"
          release_tag="v${release_version}"

          echo "version=${release_version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "base_tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "mode=release" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${release_version}"

      - name: Create release tag
        if: steps.release.outputs.mode == 'release'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${{ steps.release.outputs.release_tag }}" \
            --message "Release ${{ steps.release.outputs.release_tag }}"
          git push origin "${{ steps.release.outputs.release_tag }}"

      - name: Prepare GoReleaser base tag
        if: steps.release.outputs.mode == 'release'
        shell: bash
        env:
          BASE_TAG: ${{ steps.release.outputs.base_tag }}
        run: |
          set -euo pipefail
          git tag --force --annotate "${BASE_TAG}" "${GITHUB_SHA}" \
            --message "Build base version ${BASE_TAG}"

      - name: Run GoReleaser snapshot
        if: steps.release.outputs.mode == 'release'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.release.outputs.base_tag }}
          RUNNUMBER: ${{ github.run_number }}

      - name: Publish release
        if: steps.release.outputs.mode == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            --title "Release ${VERSION}" \
            --generate-notes
          gh release upload "${RELEASE_TAG}" \
            dist/*.apk \
            dist/*.deb \
            dist/*.tar.gz \
            dist/checksums.txt

      - name: Trigger Home Assistant app build
        if: steps.release.outputs.mode == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APP_PULSE2MQTT_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          jq -n \
            --arg version "${VERSION}" \
            --arg tag "${RELEASE_TAG}" \
            --arg channel "latest" \
            --arg sha "${SHA}" \
            '{event_type: "release-built", client_payload: {repository: "pulse2mqtt", version: $version, tag: $tag, channel: $channel, sha: $sha}}' \
            | gh api --method POST repos/SnisLab/app-pulse2mqtt/dispatches --input -
