name: goreleaser

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
          cache: true
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Lint GitHub Actions
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: .github/workflows/release.yaml
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      - name: Check GoReleaser configuration
        run: goreleaser check

  release:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
          cache: true
      - name: Determine release mode
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^var Version = "([^"]+)"$/\1/p' include/version/version.go)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version in include/version/version.go: ${version}" >&2
            exit 1
          fi

          release_version="${version}.${GITHUB_RUN_NUMBER}"
          release_tag="v${release_version}"

          {
            echo "version=${release_version}"
            echo "release_tag=${release_tag}"
            echo "base_tag=v${version}"
            echo "mode=release"
            echo "release_sha=${GITHUB_SHA}"
          } >> "${GITHUB_OUTPUT}"
          echo "Release version: ${release_version}"

      - name: Update changelog
        if: steps.release.outputs.mode == 'release'
        id: changelog
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          ORIGINAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "release_sha=$(git rev-list -n 1 "${RELEASE_TAG}")" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          previous_tag="$(git tag --list 'v*' --sort=-version:refname | sed -n '1p')"
          if [[ -n "${previous_tag}" ]]; then
            range="${previous_tag}..${ORIGINAL_SHA}"
          else
            range="${ORIGINAL_SHA}"
          fi

          {
            added="$(git log --no-merges "${range}" --format='- %s (%h)' --grep='^feat' --regexp-ignore-case)"
            fixed="$(git log --no-merges "${range}" --format='- %s (%h)' --grep='^fix' --regexp-ignore-case)"
            changed="$(git log --no-merges "${range}" --format='- %s (%h)' --grep='^\(refactor\|perf\)' --regexp-ignore-case)"
            if [[ -n "${added}" ]]; then
              printf '### Added\n\n%s\n\n' "${added}"
            fi
            if [[ -n "${fixed}" ]]; then
              printf '### Fixed\n\n%s\n\n' "${fixed}"
            fi
            if [[ -n "${changed}" ]]; then
              printf '### Changed\n\n%s\n\n' "${changed}"
            fi
            if [[ -z "${added}${fixed}${changed}" ]]; then
              printf '%s\n\n' '- Maintenance release.'
            fi
          } > "${RUNNER_TEMP}/changelog-entry.md"

          {
            if [[ "$(sed -n '1p' CHANGELOG.md)" == "# Changelog" ]]; then
              sed -n '1p' CHANGELOG.md
              printf '\n'
              printf '## %s\n\n' "${VERSION}"
              cat "${RUNNER_TEMP}/changelog-entry.md"
              sed -n '2,$p' CHANGELOG.md
            else
              printf '# Changelog\n\n'
              printf '## %s\n\n' "${VERSION}"
              cat "${RUNNER_TEMP}/changelog-entry.md"
              cat CHANGELOG.md
            fi
          } > "${RUNNER_TEMP}/CHANGELOG.md"
          mv "${RUNNER_TEMP}/CHANGELOG.md" CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${VERSION} [skip ci]"
          git push origin HEAD:main
          echo "release_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Create release tag
        if: steps.release.outputs.mode == 'release'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="${{ steps.release.outputs.release_tag }}"
          release_sha="${{ steps.changelog.outputs.release_sha }}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            test "$(git rev-list -n 1 "${tag}")" = "${release_sha}"
          else
            git tag --annotate "${tag}" "${release_sha}" --message "Release ${tag}"
            git push origin "${tag}"
          fi

      - name: Prepare GoReleaser base tag
        if: steps.release.outputs.mode == 'release'
        shell: bash
        env:
          BASE_TAG: ${{ steps.release.outputs.base_tag }}
          RELEASE_SHA: ${{ steps.changelog.outputs.release_sha }}
        run: |
          set -euo pipefail
          git tag --force --annotate "${BASE_TAG}" "${RELEASE_SHA}" \
            --message "Build base version ${BASE_TAG}"

      - name: Run GoReleaser snapshot
        if: steps.release.outputs.mode == 'release'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.release.outputs.base_tag }}
          RUNNUMBER: ${{ github.run_number }}

      - name: Publish release
        if: steps.release.outputs.mode == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.changelog.outputs.release_sha }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v version="${VERSION}" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "${notes}"
          if [[ ! -s "${notes}" ]]; then
            printf '%s\n' '- Maintenance release.' > "${notes}"
          fi

          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --target "${RELEASE_SHA}" \
              --title "Release ${VERSION}" \
              --notes-file "${notes}"
          else
            gh release edit "${RELEASE_TAG}" \
              --title "Release ${VERSION}" \
              --notes-file "${notes}"
          fi
          gh release upload "${RELEASE_TAG}" \
            dist/*.apk \
            dist/*.deb \
            dist/*.tar.gz \
            dist/checksums.txt \
            --clobber

      - name: Verify published release
        if: steps.release.outputs.mode == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "${RELEASE_TAG}" --json tagName --jq '.tagName')" = "${RELEASE_TAG}"
          assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          for asset in \
            pulse2mqtt_linux_amd64.tar.gz \
            pulse2mqtt_linux_arm64.tar.gz \
            pulse2mqtt_linux_amd64.apk \
            pulse2mqtt_linux_arm64.apk \
            checksums.txt; do
            grep -Fx "${asset}" <<<"${assets}"
          done

      - name: Trigger Home Assistant app build
        if: steps.release.outputs.mode == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APP_PULSE2MQTT_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          SHA: ${{ steps.changelog.outputs.release_sha }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error title=Missing app dispatch token::The APP_PULSE2MQTT_TOKEN secret is not configured."
            exit 1
          fi

          jq -n \
            --arg version "${VERSION}" \
            --arg tag "${RELEASE_TAG}" \
            --arg channel "latest" \
            --arg sha "${SHA}" \
            '{event_type: "release-built", client_payload: {repository: "pulse2mqtt", version: $version, tag: $tag, channel: $channel, sha: $sha}}' \
            | gh api --method POST repos/SnisLab/app-pulse2mqtt/dispatches --input -
